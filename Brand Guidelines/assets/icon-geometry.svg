      <path d="M20 0H0V20" fill="none" stroke="#374A5A" stroke-opacity=".24" stroke-width="1"/>
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor-grid)"/>
      <path d="M100 0H0V100" fill="none" stroke="#374A5A" stroke-opacity=".45" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1360" height="460" rx="8" fill="#131A20"/>
  <rect width="1360" height="460" rx="8" fill="url(#major-grid)"/>

