<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="460" viewBox="0 0 1360 460" role="img" aria-labelledby="title description">
  <title id="title">HIBP icon geometry and alignment</title>
  <desc id="description">Engineering-style construction drawing of the five original parallelograms. Each has the same horizontal width w. Slanted guides show the aligned sides of the stacked pair; horizontal guides show the shared top and bottom of the dashes and the baseline of all four upper components.</desc>
